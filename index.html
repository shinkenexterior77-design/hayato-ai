<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061321"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="HAYATO AI"><link rel="manifest" href="./manifest.webmanifest"><title>HAYATO AI</title>
<style>
:root{color-scheme:dark;--a:#61e5fa;--b:#071421;--p:#0d2436;--t:#e7f8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 10%,#17364a 0,#071421 47%,#040a12 100%);color:var(--t);font-family:system-ui,-apple-system,sans-serif}.app{max-width:720px;margin:auto;min-height:100svh;padding:calc(12px + env(safe-area-inset-top)) 15px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #204256;padding:8px 0 14px}.logo{font-size:19px;font-weight:800;letter-spacing:.18em}.logo span{color:var(--a)}.status{font-size:11px;color:#a2e6d2;border:1px solid #29594e;border-radius:20px;padding:6px 9px}.stage{position:relative;min-height:250px;display:grid;place-items:center;overflow:hidden}.halo{position:absolute;width:240px;height:240px;border:1px solid #26688477;border-radius:50%;box-shadow:inset 0 0 60px #1c80ae22;animation:turn 18s linear infinite}.halo:before,.halo:after{content:"";position:absolute;inset:23px;border:1px dashed #4ed7ff66;border-radius:50%}.halo:after{inset:-15px;border:1px solid #3b89a533;transform:scaleY(.57) rotate(28deg)}.core{width:144px;height:144px;border-radius:50%;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#d3ffff 0%,#69e5f7 8%,#168db4 20%,#0a3d62 49%,#061526 70%);box-shadow:0 0 35px #24c5e999,inset -16px -18px 35px #020c1b;animation:float 4.4s ease-in-out infinite,glow 3.5s ease-in-out infinite;transition:filter .3s}.core:after{content:"";position:absolute;inset:-11px;border-radius:50%;border:2px solid #5be4fa99;transform:scaleY(.43) rotate(-25deg)}.core strong{font-size:45px;font-weight:300;color:#dffcff;text-shadow:0 0 20px white}.core.speaking{animation:float 1.3s ease-in-out infinite, speakPulse .42s ease-in-out infinite alternate}.core.listening{filter:hue-rotate(65deg);animation:float 2s ease-in-out infinite, speakPulse .8s ease-in-out infinite alternate}.core.thinking{animation:turn 4s linear infinite,glow 1.3s ease-in-out infinite}.stage-caption{position:absolute;bottom:7px;font-size:11px;letter-spacing:.22em;color:#92c9dc}.intro{text-align:center;margin:0 0 12px}.intro h1{font-size:22px;margin:0 0 6px}.intro p{font-size:12px;color:#91b3c4;margin:0}.controls{display:flex;justify-content:center;align-items:center;gap:10px;margin:13px 0}.toggle{font-size:12px;color:#bfefff;background:#0c2a3c;border:1px solid #26556d;border-radius:20px;padding:8px 13px;cursor:pointer}.toggle[aria-pressed="false"]{opacity:.6}.chat{flex:1;min-height:180px;max-height:38vh;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:9px 0}.msg{max-width:88%;padding:11px 13px;border-radius:15px;white-space:pre-wrap;line-height:1.6;font-size:14px}.msg.bot{align-self:flex-start;background:#0e2536;border:1px solid #1a4a60}.msg.user{align-self:flex-end;background:#16445d;border:1px solid #286782}.who{font-size:10px;color:#80b2c6;margin-bottom:4px}.entry{display:flex;gap:8px;background:#0a1d2c;border:1px solid #225069;border-radius:16px;padding:9px}textarea{flex:1;min-width:0;min-height:45px;max-height:100px;resize:vertical;background:transparent;color:white;border:0;outline:0;font:inherit;padding:9px 4px}.btn{border:1px solid #31718a;background:#12415c;border-radius:12px;color:#e0faff;padding:0 14px;min-height:44px;cursor:pointer}.btn.recording{background:#8c304b}footer{font-size:10px;color:#7d9dad;text-align:center;padding-top:10px}button:focus-visible,textarea:focus-visible{outline:2px solid white;outline-offset:2px}@keyframes float{0%,100%{transform:translateY(4px)}50%{transform:translateY(-8px)}}@keyframes glow{0%,100%{box-shadow:0 0 25px #24c5e966,inset -16px -18px 35px #020c1b}50%{box-shadow:0 0 55px #24c5e9cc,inset -16px -18px 35px #020c1b}}@keyframes speakPulse{to{transform:scale(1.075);box-shadow:0 0 70px #53efff}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.halo,.core,.core.speaking,.core.listening,.core.thinking{animation:none!important}}
</style></head><body><div class="app"><header><div class="logo">HAYATO <span>AI</span></div><div class="status" id="status">● READY</div></header><section class="stage" aria-label="動くAIコア"><div class="halo"></div><div class="core" id="core"><strong>H</strong></div><div class="stage-caption" id="coreLabel">STANDBY</div></section><div class="intro"><h1>任せろ、相棒。</h1><p>気軽に話しかけて。俺が一緒に考える。</p></div><div class="controls"><button class="toggle" id="voiceToggle" type="button" aria-pressed="true">🔊 読み上げ ON</button><button class="toggle" id="motionToggle" type="button" aria-pressed="true">◉ 動き ON</button></div><section class="connection" style="background:#0a2030;border:1px solid #24516a;border-radius:14px;padding:12px;margin:0 0 10px;font-size:12px"><div style="font-weight:700;margin-bottom:8px">AI頭脳の接続設定 <span id="connectionState" style="color:#91b3c4">未接続・試作モード</span></div><input id="endpoint" type="url" placeholder="https://あなたのWorker.workers.dev" aria-label="Cloudflare Worker URL" style="width:100%;padding:10px;background:#071421;border:1px solid #24516a;border-radius:8px;color:white;margin-bottom:7px"><div style="display:flex;gap:7px"><input id="pin" type="password" placeholder="自分で設定した接続PIN" aria-label="接続PIN" style="min-width:0;flex:1;padding:10px;background:#071421;border:1px solid #24516a;border-radius:8px;color:white"><button id="saveConnection" type="button" class="btn">接続設定</button></div><div style="color:#91b3c4;margin-top:7px">URLは端末に保存。PINはページを閉じると消える。APIキーはここに入力しないでね。</div></section><main class="chat" id="chat" aria-live="polite"><div class="msg bot"><div class="who">HAYATO</div>よう、相棒！ハヤトだ。何かあったら言ってくれ。できることから一緒に片づけよう。</div></main><form class="entry" id="form"><button type="button" class="btn" id="mic" aria-label="音声入力">🎙️</button><textarea id="input" rows="1" placeholder="ハヤトに話しかける…" aria-label="メッセージ"></textarea><button class="btn" type="submit">送信</button></form><footer>HAYATO AI · CORE v0.3 · AI接続対応（要設定）</footer></div>
<script>
const $=id=>document.getElementById(id),chat=$('chat'),core=$('core'),status=$('status'),label=$('coreLabel');let voiceOn=true,motionOn=true,rec=null;let workerUrl=localStorage.getItem("hayato_worker_url")||"",accessPin="",history=[];
function mode(s){core.classList.remove('speaking','listening','thinking');if(motionOn&&s!=='standby')core.classList.add(s);label.textContent=s.toUpperCase();status.textContent='● '+(s==='standby'?'READY':s.toUpperCase())}
function add(t,role){let e=document.createElement('div');e.className='msg '+role;let w=document.createElement('div');w.className='who';w.textContent=role==='bot'?'HAYATO':'YOU';e.append(w,document.createTextNode(t));chat.append(e);chat.scrollTop=chat.scrollHeight;return e}
function reply(q){if(/おはよう|こんにちは|こんばんは/.test(q))return 'よう、相棒！今日もよろしくな。まず何から始める？';if(/できること|機能/.test(q))return '今は試作版だ。文字のやり取り、音声入力、読み上げ、それから動くAIコアが使えるぜ。本格的な調査や推論はAI接続後に追加する予定だ。';if(/分析|調べ|検索/.test(q))return '任せろ。まず何を調べたいか教えてくれ。ちなみに今はまだWeb検索と本格AIは未接続だ。確認できた事実と推測を分けて考える仕組みは、次の開発で入れよう。';if(/予定|タスク|やること/.test(q))return '了解。やることと期限を教えてくれ。重要な順に整理するところから始めよう。';return '了解、相棒。話は受け取ったぜ。今は簡易応答の試作モードだけど、ハヤトらしい話し方と動きを試せるようにした。次にやりたいことを教えてくれ。'}
function speak(t){if(!voiceOn||!('speechSynthesis'in window)){mode('standby');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.93;u.pitch=.78;const v=speechSynthesis.getVoices().filter(x=>x.lang.startsWith('ja'));if(v.length)u.voice=v[0];u.onstart=()=>mode('speaking');u.onend=()=>mode('standby');u.onerror=()=>mode('standby');speechSynthesis.speak(u)}
function setConnection(){const active=Boolean(workerUrl&&accessPin);$('connectionState').textContent=active?'接続設定済み':'未接続・試作モード';$('connectionState').style.color=active?'#8ceac2':'#91b3c4'}
$('endpoint').value=workerUrl;setConnection();
$('saveConnection').addEventListener('click',()=>{const u=$('endpoint').value.trim().replace(/\/$/,'');if(u&&!/^https:\/\/[a-z0-9.-]+(?::443)?$/i.test(u)){alert('https:// から始まるWorkerのURLを入力してね（末尾の / は不要）');return}workerUrl=u;accessPin=$('pin').value.trim();localStorage.setItem('hayato_worker_url',workerUrl);setConnection();add(workerUrl&&accessPin?'接続先を登録したぜ。メッセージを送ればAIに問い合わせるよ。':'今は試作モードだ。接続するにはWorker URLとPINを入力してくれ。','bot')});
async function send(t){const q=t.trim();if(!q)return;add(q,'user');$('input').value='';mode('thinking');const e=add('考え中…','bot');let answer='',success=false;
 if(workerUrl&&accessPin){try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),25000);let r;try{r=await fetch(workerUrl,{method:'POST',headers:{'Content-Type':'application/json','X-Hayato-Pin':accessPin},body:JSON.stringify({message:q,history:history.slice(-8)}),signal:controller.signal})}finally{clearTimeout(timer)}const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'HTTP '+r.status);if(typeof data.reply!=='string'||!data.reply.trim())throw Error('空の応答');answer=data.reply;success=true;history.push({role:'user',content:q},{role:'assistant',content:answer});history=history.slice(-8)}catch(err){answer='AI接続エラー：'+err.message+'。設定やWorkerの状態を確認してくれ。勝手に試作応答には切り替えないよ。'}}else{answer=reply(q)}
 e.lastChild.textContent=answer;speak(answer)}
$('form').addEventListener('submit',e=>{e.preventDefault();send($('input').value)});
$('voiceToggle').addEventListener('click',()=>{voiceOn=!voiceOn;$('voiceToggle').setAttribute('aria-pressed',String(voiceOn));$('voiceToggle').textContent='🔊 読み上げ '+(voiceOn?'ON':'OFF');if(!voiceOn&&'speechSynthesis'in window){speechSynthesis.cancel();mode('standby')}});
$('motionToggle').addEventListener('click',()=>{motionOn=!motionOn;$('motionToggle').setAttribute('aria-pressed',String(motionOn));$('motionToggle').textContent='◉ 動き '+(motionOn?'ON':'OFF');if(!motionOn)core.classList.remove('speaking','listening','thinking')});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){rec=new SR();rec.lang='ja-JP';rec.interimResults=false;rec.onresult=e=>send(e.results[0][0].transcript);rec.onerror=()=>{mode('standby');$('mic').classList.remove('recording')};rec.onend=()=>{$('mic').classList.remove('recording');if(label.textContent==='LISTENING')mode('standby')}}
$('mic').addEventListener('click',()=>{if(!rec){add('このブラウザでは音声入力が使えないみたいだ。文字で話しかけてくれ。','bot');return}try{mode('listening');$('mic').classList.add('recording');rec.start()}catch{mode('standby')}});
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
