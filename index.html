<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HAYATO AI">
<link rel="manifest" href="./manifest.webmanifest">
<title>HAYATO AI</title>
<style>
:root{color-scheme:dark;--bg:#06101d;--panel:#0b1a2b;--line:#183b54;--cyan:#62e7ff;--muted:#8ca9bc;--white:#eaf7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 5%,#12324b 0,#071321 42%,#040a12 100%);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100svh}
.app{max-width:720px;margin:auto;min-height:100svh;padding:env(safe-area-inset-top) 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 12px;border-bottom:1px solid #17334a}
.brand{font-weight:800;letter-spacing:.2em;font-size:18px}.sub{font-size:10px;letter-spacing:.18em;color:var(--muted);margin-top:4px}
.status{font-size:11px;color:#8cebc4;border:1px solid #245c51;border-radius:30px;padding:7px 10px}
.hero{text-align:center;padding:26px 0 18px}
.orb{width:132px;height:132px;margin:0 auto 16px;border-radius:50%;position:relative;background:radial-gradient(circle at 35% 30%,#b9faff 0,#48cce9 8%,#0d668e 25%,#08263e 58%,#06101d 72%);box-shadow:0 0 24px #2ccfff66,0 0 70px #168ac455,inset 0 0 24px #9df5ff66;display:grid;place-items:center}
.orb:before,.orb:after{content:"";position:absolute;inset:-10px;border:1px solid #50dfff77;border-radius:50%;transform:scaleY(.38) rotate(-18deg)}
.orb:after{inset:-18px;transform:scaleY(.52) rotate(28deg);border-color:#3e9fca66}
.orb span{font-size:27px;font-weight:300;letter-spacing:.08em;text-shadow:0 0 18px #8ff}
.hero h1{font-size:23px;letter-spacing:.12em;margin:0}.hero p{color:var(--muted);font-size:12px;margin:8px 0 0}
.quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.chip{background:#0b2032;border:1px solid #1b4962;color:#bdefff;border-radius:22px;padding:9px 12px;font-size:12px}
.chat{flex:1;min-height:220px;max-height:43vh;overflow:auto;padding:12px 2px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.65;white-space:pre-wrap}
.bot{align-self:flex-start;background:#0c2031;border:1px solid #19445c;border-bottom-left-radius:5px}
.user{align-self:flex-end;background:#123c55;border:1px solid #236887;border-bottom-right-radius:5px}
.meta{font-size:10px;color:#83a7bb;margin-bottom:4px}
.composer{border:1px solid #1b4058;background:#091827;border-radius:18px;padding:10px;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;min-height:42px;max-height:110px;background:transparent;border:0;outline:0;color:var(--white);font:inherit;padding:10px 4px}
.iconbtn,.send{border:1px solid #28617b;background:#102b40;color:#c8f6ff;border-radius:13px;width:43px;height:43px;font-size:18px;flex:none}
.send{background:linear-gradient(135deg,#147da5,#13506f);font-size:14px;font-weight:700}
.iconbtn.active{background:#7d2536;border-color:#ef7890}
.foot{display:flex;justify-content:space-between;color:#68899e;font-size:10px;padding:10px 4px}
.notice{font-size:11px;color:#87a4b8;text-align:center;line-height:1.5;margin-top:8px}
button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media(min-width:600px){.hero{padding-top:34px}.orb{width:150px;height:150px}.chat{max-height:440px}}
</style>
</head>
<body>
<div class="app">
<header><div><div class="brand">HAYATO <span style="color:var(--cyan)">AI</span></div><div class="sub">PERSONAL INTELLIGENCE ASSISTANT</div></div><div class="status" id="status">● ONLINE</div></header>
<section class="hero">
  <div class="orb" aria-hidden="true"><span>H</span></div>
  <h1>どうした？相棒。</h1>
  <p>調査・分析・アイデア整理をサポートするよ。</p>
  <div class="quick">
    <button class="chip" data-prompt="今日やることを整理して">タスクを整理</button>
    <button class="chip" data-prompt="情報を分析するときの進め方を教えて">分析を始める</button>
    <button class="chip" data-prompt="ハヤト、できることを教えて">機能を確認</button>
  </div>
</section>
<main class="chat" id="chat" aria-live="polite">
  <div class="msg bot"><div class="meta">HAYATO</div>おはよう！ハヤトだよ。今日は何を一緒に進めようか？文字でも、マイクでも気軽に話しかけて。</div>
</main>
<form class="composer" id="form">
  <button class="iconbtn" id="mic" type="button" aria-label="音声入力" title="音声入力">🎙</button>
  <textarea id="input" rows="1" placeholder="ハヤトに話しかける…" aria-label="メッセージ"></textarea>
  <button class="send" type="submit">送信</button>
</form>
<div class="notice" id="voiceNote">マイクは音声入力、読み上げは端末の音声機能を使うよ。</div>
<div class="foot"><span>HAYATO CORE · PROTOTYPE 0.1</span><span id="clock"></span></div>
</div>
<script>
const chat=document.getElementById('chat'), input=document.getElementById('input'), statusEl=document.getElementById('status');
const form=document.getElementById('form'), mic=document.getElementById('mic');
let listening=false, recognition=null;
const add=(text,who)=>{const el=document.createElement('div');el.className='msg '+who;const meta=document.createElement('div');meta.className='meta';meta.textContent=who==='bot'?'HAYATO':'YOU';el.append(meta,document.createTextNode(text));chat.append(el);chat.scrollTop=chat.scrollHeight;return el};
function localReply(q){
 const s=q.toLowerCase();
 if(/できること|機能/.test(q)) return '俺は会話、考えの整理、文章作成、画像や資料の読み解き、調査の段取りを手伝えるよ。今の試作版は画面と音声入力・読み上げが動く状態。外部AIやリアルタイム検索は、サーバーを接続すると使えるようになる。';
 if(/分析|調べ|調査|比較/.test(q)) return '了解。まず目的と条件を整理しよう。次に、確認できた事実・推測・未確認の点を分けて、複数の情報を照合する。分析したいテーマや資料を送ってくれたら、そこから一緒に進めるよ。※今は試作モードなので、最新情報の自動検索はまだ接続されていないよ。';
 if(/予定|タスク|やること/.test(q)) return '任せて。まず、今日中に必要なことを重要度と期限で分けよう。やることを箇条書きで送ってくれれば、優先順位をつけて整理するよ。';
 if(/おはよう|こんにちは|こんばんは/.test(q)) return 'おはよう！今日もよろしく。まず何から始めようか？';
 return '了解、相棒。内容を受け取ったよ。今の俺は画面・音声入力・読み上げが動く試作版なんだ。AIの本格的な回答やWeb検索を有効にするには、安全なサーバー経由でAI APIを接続する必要がある。次にやりたいことを具体的に教えて。';
}
async function askBackend(message){
 // Optional backend: POST {message} to /api/chat; server returns {reply}.
 try{
   const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});
   if(!r.ok) throw new Error('backend unavailable');
   const data=await r.json(); if(data.reply) return data.reply;
 }catch(e){}
 return localReply(message);
}
function speak(text){
 if(!('speechSynthesis' in window)) return;
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.94;u.pitch=.82;
 const voices=speechSynthesis.getVoices();const ja=voices.find(v=>v.lang==='ja-JP');if(ja)u.voice=ja;speechSynthesis.speak(u);
}
async function send(message){
 const q=message.trim();if(!q)return;add(q,'user');input.value='';input.style.height='auto';
 statusEl.textContent='● THINKING';const pending=add('考え中…','bot');
 const reply=await askBackend(q);pending.lastChild.textContent=reply;statusEl.textContent='● ONLINE';chat.scrollTop=chat.scrollHeight;speak(reply);
}
form.addEventListener('submit',e=>{e.preventDefault();send(input.value)});
document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>send(b.dataset.prompt)));
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,110)+'px'});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){recognition=new SR();recognition.lang='ja-JP';recognition.interimResults=false;recognition.onresult=e=>{input.value=e.results[0][0].transcript;send(input.value)};recognition.onerror=()=>{statusEl.textContent='● ONLINE';listening=false;mic.classList.remove('active')};recognition.onend=()=>{listening=false;mic.classList.remove('active');statusEl.textContent='● ONLINE'};}
mic.addEventListener('click',()=>{if(!recognition){document.getElementById('voiceNote').textContent='このブラウザでは音声入力に対応していないみたい。文字入力を使ってね。';return;}if(listening){recognition.stop();return;}try{listening=true;mic.classList.add('active');statusEl.textContent='● LISTENING';recognition.start();}catch(e){listening=false;mic.classList.remove('active')}});
document.getElementById('clock').textContent=new Intl.DateTimeFormat('ja-JP',{hour:'2-digit',minute:'2-digit'}).format(new Date());
if('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
